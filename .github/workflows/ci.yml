name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes anything; say so rather than inheriting the default.
permissions:
  contents: read

jobs:
  core:
    # The core is plain Rust with no UI, so it is tested on all three
    # platforms directly. If it only ever ran on macOS, a path assumption or a
    # line-ending difference would not surface until someone tried to ship a
    # Windows build.
    name: Core — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -p bhn-core -- --check

      - name: Clippy
        run: cargo clippy -p bhn-core --all-targets -- -D warnings

      - name: Tests
        # Includes the power-cut test, which spawns a child that aborts.
        run: cargo test -p bhn-core

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Typecheck and build
        run: npm run build
        working-directory: app
