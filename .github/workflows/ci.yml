name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes anything; say so rather than inheriting the default.
permissions:
  contents: read

jobs:
  core:
    # The core is plain Rust with no UI, so it is tested on all three
    # platforms directly. If it only ever ran on macOS, a path assumption or a
    # line-ending difference would not surface until someone tried to ship a
    # Windows build.
    name: Core — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        # --all, not just the core: the Tauri shell was hand-indented with
        # tabs, which meant every edit to it had to guess the house style and
        # rustfmt would rewrite the whole file the first time anyone ran it.
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p bhn-core --all-targets -- -D warnings

      - name: Tests
        # Includes the power-cut test, which spawns a child that aborts.
        run: cargo test -p bhn-core

      - name: Shell tests
        # The Tauri shell had no tests until the window hit-testing arrived.
        # That arithmetic decides whether a dragged tab is torn off or put
        # back, so an off-by-one on an edge is a user-visible bug.
        #
        # ⚠️ NOT on Linux. This job exists to prove the core is portable, so
        # the runner has no GTK or WebKit development packages — and the shell
        # crate pulls in glib through Tauri, which then fails to build with
        # "Package glib-2.0 was not found". Installing them here would make
        # every core run slower to test something this job is not for; the
        # Linux shell is still built in full by release.yml.
        if: matrix.os != 'ubuntu-latest'
        run: cargo test -p bhnotepad

      - name: Tests (with the update checker)
        # The shipped app builds this feature, so it has to be tested too —
        # including the host allowlist that keeps a download on github.com.
        # No test here reaches the network.
        run: cargo test -p bhn-core --features updates

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Dark palette is consistent
        # Guards the deliberate duplication in styles.css — see the script.
        run: node scripts/check-theme-tokens.mjs

      - name: No React hooks below App.tsx's early return
        # A conditional hook blanks the whole window with no error anywhere.
        run: node scripts/check-hook-order.mjs

      - name: Save All can be escaped, and macOS binds Cmd+Shift+S to Save As
        # Cancelling one sheet used to open the next, which on a session of
        # scratch tabs is a queue of unescapable dialogs. Runs on every
        # platform on purpose: the macOS binding is edited from any machine.
        run: node scripts/check-save-all-abort.mjs

      - name: Typecheck and build
        run: npm run build
        working-directory: app
