name: Release

# Builds the installers for a tag and attaches them to its release.
#
# ⚠️ STORAGE: this repository is on GitHub's free plan, where Actions artifacts
# and Packages share a 500 MB pooled allowance. Release assets are NOT part of
# that pool. So installers are uploaded straight to the release with
# `gh release upload` and `actions/upload-artifact` is never used here — adding
# it would start eating that 500 MB a few megabytes per build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Creating the release and attaching installers needs write access to contents;
# the default token is read-only.
permissions:
  contents: write

# Two tags released at once could prune each other's release. Serialise them,
# and never cancel a run half-way through uploading.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple silicon)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - os: macos-latest
            name: macOS (Intel)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          # These build but have never been run on their own platform — see
          # DISCLAIMER.md. They may fail without holding up a macOS release.
          - os: windows-latest
            name: Windows
            target: ""
            # NSIS only, no MSI. The MSI installs per-machine, so msiexec
            # elevates and the app is started in the installer's SYSTEM
            # context — WebView2 then cannot write its data folder and Edge
            # reports "can't read and write to its data directory". The NSIS
            # installer is per-user and does not elevate.
            args: --bundles nsis
            optional: true
          - os: ubuntu-latest
            name: Linux (x86_64)
            target: ""
            # No AppImage: it carries its own copy of GTK and WebKit and comes
            # out ~75 MB for the same 3 MB application.
            args: --bundles deb,rpm
            optional: true
          # A Linux VM on an Apple-silicon Mac is arm64, and an amd64 .deb
          # simply refuses to install there. arm64 runners are free for public
          # repositories.
          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            target: ""
            args: --bundles deb,rpm
            optional: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The build runs third-party code (npm install, build scripts) in a
          # job that holds contents:write. Don't leave a git credential lying
          # in the checkout for it to find; the upload step authenticates
          # explicitly through GH_TOKEN instead.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Intel build runs on an Apple-silicon runner, so its target has
          # to be installed explicitly.
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - run: npm ci
        working-directory: app

      - name: Build
        working-directory: app
        env:
          # Ad-hoc sign the app *during* bundling, before the disk image is
          # made. Signing afterwards is too late — and leaving it unsigned
          # makes a downloaded build report as "damaged" rather than merely
          # unverified.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `mapfile` does not exist in the bash 3.2 that ships with macOS.
          # Tauri's dmg script has also been seen leaving the finished .dmg in
          # the staging directory rather than bundle/dmg, so search broadly and
          # skip its read-write working images (rw.*.dmg).
          # ⚠️ Search BOTH roots. `.cargo/config.toml` sends build output to
          # `build.noindex/target` so macOS Spotlight does not index the dev
          # build and show a second BHNotepad in Finder — but `target` is kept
          # here so this keeps working if that setting is ever changed back.
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find build.noindex target -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            -not -name '*.sig' -not -name 'rw.*.dmg' 2>/dev/null | sort)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers were produced"
            find build.noindex target -maxdepth 5 -type d -name bundle -exec find {} -type f \; 2>/dev/null | head -40
            exit 1
          fi

          printf 'found:\n'; printf '  %s\n' "${files[@]}"

          # NOT a draft. The prune job below deletes the previous release once
          # this one has its installers, and a draft is invisible to everyone
          # — so creating this as a draft left the Releases page with nothing
          # downloadable until a human published it by hand. That gap was real
          # and happened twice.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --latest \
              --title "BHNotepad $TAG" \
              --notes "Installers for macOS, Windows and Linux are attached below. macOS builds are ad-hoc signed, not notarised: open System Settings › Privacy & Security and click Open Anyway the first time. Fuller notes are usually edited in shortly after the build." \
              || true
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Only the newest release is kept, so the Releases page never accumulates
  # builds nobody should be downloading.
  prune:
    name: Remove older releases
    needs: build
    # `success()`, NOT `always()`. The optional Windows and Linux jobs are
    # continue-on-error, so they still report success and cannot hold a macOS
    # release up — but a FAILED macOS build must stop the prune, or a partly
    # built release would replace a complete one and leave nothing good to
    # download.
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete every release but the newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Never prune unless the release being built actually exists and has
          # something attached; deleting the old ones after a failed build
          # would leave nothing to download at all.
          # Both macOS installers must be present, not merely "at least one
          # asset": a release carrying only a Linux .deb is not something to
          # delete the previous complete release for.
          dmgs=$(gh release view "$KEEP" --repo "$GITHUB_REPOSITORY" \
                   --json assets -q '[.assets[].name | select(endswith(".dmg"))] | length' \
                   2>/dev/null || echo 0)
          if [ "$dmgs" -lt 2 ]; then
            echo "::warning::$KEEP has $dmgs of 2 macOS installers — keeping the older releases"
            exit 0
          fi

          # And it must actually be visible. Deleting the only downloadable
          # release in favour of a draft is worse than keeping both.
          draft=$(gh release view "$KEEP" --repo "$GITHUB_REPOSITORY" \
                    --json isDraft -q '.isDraft' 2>/dev/null || echo true)
          if [ "$draft" != "false" ]; then
            echo "::warning::$KEEP is still a draft — keeping the older releases"
            exit 0
          fi

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName -q '.[].tagName' \
          | while read -r tag; do
              [ "$tag" = "$KEEP" ] && continue
              echo "removing $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
