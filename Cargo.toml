[workspace]
resolver = "2"
members = ["crates/bhn-core", "app/src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
authors = ["BiswasHost <benjamin.biswas@gmail.com>"]
repository = "https://github.com/wpexpertinbd/BHNotepad"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"

# Size matters: these installers are attached to GitHub Releases and Benjamin
# is on the free plan. `opt-level = "s"` plus LTO and a single codegen unit
# trade a little compile time for a noticeably smaller binary, and stripping
# symbols removes debug info nobody can use from a release build anyway.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
