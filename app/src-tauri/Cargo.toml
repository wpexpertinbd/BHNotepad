[package]
name = "bhnotepad"
description = "Notepad++-style editor whose unsaved tabs survive quitting."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Tauri builds the app as a library so the same code backs the desktop binary
# and any future mobile target.
name = "bhnotepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Kept deliberately short. Every dependency is weight in an installer that
# should stay around 3 MB, so anything added here needs a reason.
[dependencies]
bhn-core = { path = "../../crates/bhn-core", features = ["updates"] }
tauri = { version = "2", features = [] }
# Native Open/Save sheets. Writing our own file browser in the webview would
# be both bigger and worse than the one each OS already has.
tauri-plugin-dialog = "2"
# Reveal a file in Finder / Explorer / the desktop file manager. Nothing else
# from this plugin is enabled; see capabilities/default.json.
tauri-plugin-opener = "2"
# Move to Trash / Recycle Bin rather than unlink, so a deleted file is
# recoverable. Same crate BHUninstaller uses.
trash = "5"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

# Two processes sharing one session store can lose tabs: one persists a session
# that knows nothing about the other's, and those notes are left unreferenced.
# Windows and Linux start a new process for every double-clicked file; macOS
# normally keeps one instance, but `open -n` starts a rival anyway. So this is
# on for every desktop platform.
#
# Note: `cfg(desktop)` works in Rust source, where Tauri's build script defines
# it, but NOT as a Cargo target predicate — Cargo does not know that name and
# silently selects nothing, so the crate goes missing. The platforms are listed
# out instead.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"
